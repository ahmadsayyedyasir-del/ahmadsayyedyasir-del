<svg width="330" height="460" viewBox="0 0 330 460" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="strap" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#22D3EE"/>
    <stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
  </filter>
</defs>

<!-- pivot group swings the whole lanyard gently -->
<g transform-origin="165.0px 0px">
  <animateTransform attributeName="transform" type="rotate"
    values="-4 165.0 0; 4 165.0 0; -4 165.0 0" dur="4.5s" repeatCount="indefinite"
    calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>

  <!-- strap -->
  <rect x="156.0" y="0" width="18" height="150" fill="url(#strap)" rx="4"/>
  <circle cx="165.0" cy="10" r="5" fill="#0A101F" stroke="#22D3EE" stroke-width="2"/>
  <!-- clip ring -->
  <rect x="151.0" y="140" width="28" height="22" rx="7" fill="none" stroke="#22D3EE" stroke-width="3"/>

  <!-- card -->
  <g filter="url(#soft)">
    <rect x="25.0" y="158" width="280" height="290" rx="18" fill="#12192B" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="25.0" y="158" width="280" height="46" rx="18" fill="#10B981" opacity="0.12"/>
    <text x="165.0" y="188" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="3" fill="#10B981">ACCESS.CARD</text>
    <circle cx="165.0" cy="260" r="52" fill="none" stroke="#22D3EE" stroke-width="2"/>
    <circle cx="165.0" cy="260" r="46" fill="#0A101F"/>
    <text x="165.0" y="270" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="34" fill="#A78BFA">SY</text>
    <text x="165.0" y="335" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="16" font-weight="bold" fill="#CBD5E1">Sayyed Yasir Ahmad</text>
    <text x="165.0" y="356" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11.5" letter-spacing="1" fill="#4B5867">AI ENGINEER IN PROGRESS</text>
    <line x1="65.0" y1="374" x2="265.0" y2="374" stroke="#1E293B" stroke-width="1"/>
    <text x="165.0" y="396" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11" fill="#22D3EE">@ahmadsayyedyasir-del</text>
    <text x="165.0" y="414" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" fill="#4B5867">Haripur · KPK · Pakistan</text>
    <circle cx="165.0" cy="432" r="3" fill="#F87171"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="175.0" y="436" text-anchor="start" font-family="SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#F87171">ACTIVE</text>
  </g>
</g>
</svg>